name: Fix store type compatibility

on:
  push:
    branches: [fix/home-scroll-banner-jank]
    paths:
      - '.github/workflows/fix-store-type-compat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-scroll-banner-jank
      - name: Patch category store matching
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/features/home/category_stores_screen.dart')
          s = p.read_text()
          old = """        final type = store['type']?.toString().trim().toLowerCase() ?? '';

        if (type != widget.storeType.toLowerCase()) return;
"""
          new = """        final requestedType = widget.storeType.trim().toLowerCase();
        final values = <String>{
          store['type']?.toString().trim().toLowerCase() ?? '',
          store['category']?.toString().trim().toLowerCase() ?? '',
          store['categoryId']?.toString().trim().toLowerCase() ?? '',
        }..remove('');

        const aliases = <String, Set<String>>{
          'restaurant': {'restaurant', 'restaurants', 'food', 'foods', 'مطعم', 'مطاعم'},
          'supermarket': {'supermarket', 'supermarkets', 'market', 'markets', 'grocery', 'groceries', 'سوبر ماركت', 'بقالة'},
          'pharmacy': {'pharmacy', 'pharmacies', 'صيدلية', 'صيدليات'},
          'vegetables': {'vegetables', 'vegetable', 'fruits', 'fruit', 'vegetables_fruits', 'خضار', 'خضروات', 'فواكه', 'خضروات وفواكه'},
          'meat': {'meat', 'meats', 'poultry', 'لحوم', 'دواجن', 'لحوم ودواجن'},
          'bakery': {'bakery', 'bakeries', 'sweets', 'حلويات', 'مخبوزات', 'مخابز'},
          'fish': {'fish', 'seafood', 'sea_food', 'أسماك', 'مأكولات بحرية'},
          'beauty': {'beauty', 'cosmetics', 'cosmetic', 'تجميل', 'مستحضرات تجميل'},
        };
        final acceptedTypes = aliases[requestedType] ?? {requestedType};
        if (!values.any(acceptedTypes.contains)) return;
"""
          if old not in s:
              raise SystemExit('Target code not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/home/category_stores_screen.dart
          git commit -m "fix(stores): support legacy category values" || exit 0
          git push origin HEAD:fix/home-scroll-banner-jank
